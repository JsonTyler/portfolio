  <circle cx="1090" cy="82" r="212" fill="#dce5d3"/>
  <circle cx="52" cy="758" r="235" fill="#e4decc"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="70" y="70" fill="#51634e" font-size="15" font-weight="700" letter-spacing="3">AS I LEFT IT</text>
    <text x="70" y="125" fill="#253b31" font-size="39" font-weight="700">A little context. A clear next move.</text>
    <g transform="translate(83 228) rotate(-5 180 170)" filter="url(#shadow)">
