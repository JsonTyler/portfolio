      <path d="M274 0V57L300 42L326 57V0" fill="#b6784e"/>
      <text x="28" y="49" fill="#856344" font-size="14" font-weight="700" letter-spacing="2">WHEN I STOPPED</text>
      <text x="28" y="101" fill="#374438" font-size="25" font-weight="700">The idea is taking shape.</text>
      <path d="M28 131H317M28 181H317M28 231H317M28 281H317" stroke="#e0dccd"/>
      <text x="28" y="163" fill="#60665b" font-size="18">Kept the return view simple.</text>
      <text x="28" y="213" fill="#60665b" font-size="18">Decided what matters first.</text>
