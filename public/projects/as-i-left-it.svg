    <path d="M563 532L581 515L589 539" stroke="#8b9e7c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g filter="url(#shadow)">
      <rect x="480" y="198" width="640" height="438" rx="18" fill="#fcfcf7" stroke="#b8c6b0"/>
      <path d="M498 198H1102Q1120 198 1120 216V268H480V216Q480 198 498 198" fill="#263e32"/>
      <circle cx="510" cy="233" r="5" fill="#b6c9a4"/>
      <text x="530" y="239" fill="#eef2e8" font-size="17" font-weight="700">Your place, kept.</text>
      <text x="1088" y="238" text-anchor="end" fill="#c8d4c1" font-size="13">RETURN TO WORK</text>
      <text x="514" y="312" fill="#66785b" font-size="13" font-weight="700" letter-spacing="2">PROJECT / WEBSITE</text>
      <text x="514" y="357" fill="#263e32" font-size="30" font-weight="700">Right where you left it.</text>
      <rect x="514" y="385" width="572" height="114" rx="10" fill="#edf1e5"/>
      <text x="534" y="416" fill="#596f48" font-size="13" font-weight="700" letter-spacing="1.5">NEXT MOVE</text>
      <text x="534" y="451" fill="#2f4535" font-size="21" font-weight="700">Try the return flow on a small screen.</text>
      <text x="534" y="478" fill="#64705b" font-size="16">The decision and the reason are still here.</text>
      <rect x="514" y="524" width="172" height="48" rx="24" fill="#38593c"/>
      <text x="540" y="555" fill="#fffef4" font-size="17" font-weight="700">Resume work</text>
      <path d="M654 542L662 548L654 554" stroke="#fffef4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="710" y="554" fill="#65715d" font-size="16">Decisions · Notes · Questions</text>
