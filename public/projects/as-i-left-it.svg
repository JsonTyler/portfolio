    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#273a2f" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="780" fill="#eef0e6"/>
