name: Portfolio browser and visual tests

on:
  pull_request:
    branches: [master, main, staging]
  push:
    branches: [master, main, staging]
  workflow_dispatch:
    inputs:
      capture_baselines:
        description: Capture candidate baselines for review (download artifact and commit accepted images)
        type: boolean
        default: false

jobs:
  browser:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build -- --webpack
      - name: Check for reviewed Linux screenshot references
        id: references
        run: echo "present=${{ hashFiles('tests/browser/*-snapshots/*-linux.png') != '' }}" >> "$GITHUB_OUTPUT"
      - name: Run behavioral regression tests
        run: npm run test:e2e -- --grep-invert @visual
      - name: Compare approved screenshots
        if: ${{ !inputs.capture_baselines && steps.references.outputs.present == 'true' }}
        run: npm run test:visual
      - name: Capture candidate screenshot baselines
        if: ${{ inputs.capture_baselines || steps.references.outputs.present == 'false' }}
        run: npm run test:visual:update
      - name: Mark candidate screenshots for review
        if: ${{ inputs.capture_baselines || steps.references.outputs.present == 'false' }}
        run: |
          echo "::warning::Candidate screenshots were captured. Visual comparisons require reviewed Linux references to be committed."
          echo "### Screenshot review required" >> "$GITHUB_STEP_SUMMARY"
          echo "Download portfolio-candidate-baselines, review the Linux images, and commit accepted references. This run captured candidates; it did not compare approved images." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload browser report and failure diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
      - name: Upload candidate baselines
        if: ${{ always() && (inputs.capture_baselines || steps.references.outputs.present == 'false') }}
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-candidate-baselines
          path: tests/browser/*-snapshots/
          retention-days: 14
